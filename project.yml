name: CoastWild
projectReferences:
  Pods:
    path: Pods/Pods.xcodeproj
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.19.2
options:
  bundleIdPrefix: com.coastwild
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  CoastWild:
    type: application
    platform: iOS
    sources: [CoastWild]
    configFiles:
      Debug: Pods/Target Support Files/Pods-CoastWild/Pods-CoastWild.debug.xcconfig
      Release: Pods/Target Support Files/Pods-CoastWild/Pods-CoastWild.release.xcconfig
    dependencies:
      - target: Pods/Pods-CoastWild
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    preBuildScripts:
      - name: '[CP] Check Pods Manifest.lock'
        script: |
          diff "${PODS_PODFILE_DIR_PATH}/Podfile.lock" "${PODS_ROOT}/Manifest.lock" >/dev/null || exit 1
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: '[CP] Copy Pods Resources'
        script: '"${PODS_ROOT}/Target Support Files/Pods-CoastWild/Pods-CoastWild-resources.sh"'
        inputFileLists:
          - ${PODS_ROOT}/Target Support Files/Pods-CoastWild/Pods-CoastWild-resources-${CONFIGURATION}-input-files.xcfilelist
        outputFileLists:
          - ${PODS_ROOT}/Target Support Files/Pods-CoastWild/Pods-CoastWild-resources-${CONFIGURATION}-output-files.xcfilelist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huankecontact.coastwild
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ''
        'DEVELOPMENT_TEAM[sdk=iphoneos*]': T4VGJVH22P
        PROVISIONING_PROFILE_SPECIFIER: ''
        'PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]': huankeProfileDev
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coast & Wild
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save the journal photos you choose to your photo library.
        INFOPLIST_KEY_NSCameraUsageDescription: Allow camera access to capture photos and video and participate in video calls.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Allow microphone access to record audio and participate in voice and video calls.
        INFOPLIST_KEY_LEGAL_PRIVACY_URL_EN: $(LEGAL_PRIVACY_URL_EN)
        INFOPLIST_KEY_LEGAL_TERMS_URL_EN: $(LEGAL_TERMS_URL_EN)
        TARGETED_DEVICE_FAMILY: 1
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
  CoastWildUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: Tests/Fixtures
        type: folder
    dependencies:
      - target: CoastWild
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CoastWild:
    build:
      targets:
        CoastWild: all
    test:
      targets: [CoastWildUITests]
