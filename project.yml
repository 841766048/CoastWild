name: CoastWild
options:
  bundleIdPrefix: com.coastwild
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  CoastWild:
    type: application
    platform: iOS
    sources: [CoastWild]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: test.duckegg.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coast & Wild
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save the journal photos you choose to your photo library.
        TARGETED_DEVICE_FAMILY: 1
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
  CoastWildUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CoastWild
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CoastWild:
    build:
      targets:
        CoastWild: all
    test:
      targets: [CoastWildUITests]
